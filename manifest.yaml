# AgentBrain Manifest — Version contract with LiteRealm and WorkRealm projects.
# LiteRealm bootstrap and `wr sync` read this to stamp the version into the project.

version: "2.7.0"
min_literealm_version: "2.0.0"
min_workrealm_version: "0.5.0"

rag_backend: "qdrant+lancedb"   # Qdrant (QDRANT_URL) first, LanceDB fallback
pdf_parser: "docling"

scripts:
  sync_agents: "scripts/sync_agents.py"
  sync_skills: "scripts/sync_skills.py"
  ingest: "scripts/rag/ingest.py"
  query: "scripts/rag/query.py"
  rag_mcp_server: "scripts/rag/mcp_server.py"   # stdio, or --http with RAG_MCP_TOKEN
  rag_sync: "scripts/rag/sync.py"              # server corpus -> local mirror
  sync_sources: "scripts/rag/sync_sources.py"      # data/sources/ -> vector store, incremental
  classify: "scripts/rag/classify_source.py"
  add_citation: "scripts/add_citation.py"
  experiment: "scripts/data/experiment_manager.py"
  thesis_dashboard: "scripts/thesis_dashboard.py"
  style_check: "scripts/style/check_style.py"
  style_humanize: "scripts/style/local_humanizer.py"
  style_learn: "scripts/style/learn_style.py"
  setup_env_sh: "scripts/setup_env.sh"
  setup_env_ps1: "scripts/setup_env.ps1"

templates:
  - fsb-seminar
  - fsb-thesis
  - fsb-paper
  - fsb-presentation
  - fsb-video

agents:
  - latex_architect
  - data_fetcher
  - writer
  - latex_surgeon
  - qa_reviewer
  - rag_indexer
  - data_engineer
  - defense_simulator

# WorkRealm work agents: agents/work/, synced per tier with
#   sync_agents.py --namespace work --tier <tier> --prune
work_agents:
  - researcher        # task, project
  - reviewer          # task, project
  - decision_keeper   # project
  - lab_runner        # project
  - releaser          # project

# KEV-Ai-Architecture: agents/kev/, synced with --namespace kev
kev_agents:
  - adr_consolidator
  - conformance_runner
  - source_fetcher
